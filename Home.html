<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        
        <input type="text" placeholder="Search">
        
        <img src="thestickerprinting.png" alt="Website Logo" class="logo">

        <div>
            <a href="Cart.html">
                <img src="cart.png" alt="Cart Link" class="cart-icon">
            </a>
        </div>

        
    </header>
    <!-- NAVIGATION-->
    <nav class="headerNav">
        <a href="Home.html">Home</a>
        <a href="AboutUs.html">About Us</a>
        <a href="ContactUs.html">Contact</a>
        <a href="FAQ.html">FAQ</a>
    </nav>

    <main>
        <!-- HERO-->
        <section class="hero">
            <img src="homehero.png" alt="Hero Image">
            
            <!-- Arrow (placeholders)-->
            <button id="left">❮</button>
            <button id="right">❯</button>

        </section>
        <section class="herocontent">
            <a href="Categories.html" class="shopnowbtn">SHOP NOW</a>
            <p id="tagline">Eco friendly, premium quality custom printing in Australia</p>
        </section>

        <!-- Brand Key Values-->
        <section class="keyValues">
            <div>
                <img src="truck.png">
                <p>Fast Delivery</p>
            </div>

            <div>
                <img src="eco.png">
                <p>Eco Friendly</p>
            </div>

            <div>
                <img src="trusted.png">
                <p>Trusted Brand</p>
            </div>

        </section>
    </main>

     <!-- FOOTER -->
      <footer>
        <nav class="footerNav">
            <a href="AboutUs.html">About Us</a>
            <a href="ContactUs.html">Contact Us</a>
            <a href="Policies.html">Policies</a>
            <a href="FAQ.html">FAQs</a>
        </nav>
      </footer>

    
</body>
</html>
