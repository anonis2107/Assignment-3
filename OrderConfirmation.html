<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js"></script>
</head>
<body>
    <!-- HEADER -->
    <header>
        <input type="text" placeholder="Search">
        <img src="thestickerprinting.png" alt="Website Logo" class="logo">

        <div>
            <a href="Cart.html">
                <img src="cart.png" alt="Cart Link" class="cart-icon">
            </a>
        </div>

    </header>
    <!-- NAVIGATION-->
    <nav class="headerNav">
        <a href="Home.html">Home</a>
        <a href="AboutUs.html">About Us</a>
        <a href="ContactUs.html">Contact</a>
        <a href="FAQ.html">FAQ</a>
    </nav>

    <main class="confirmationPageContent">

        <!-- Hero Image-->
        <section>
            <img src="orderConfirmed.png" id="orderConfirmedImg">
        </section>

        <!-- Message -->
         <section class="confirmationMessage">
         <h2 class="thankYouMsg">Thank you for your order</h2>
         <h2>Order #<span id="ordernumber">123456</span></h2>
         <p>You will recieve an order confirmation email shortly</p>

         </section>

         <!-- Actions -->

         <section class="confirmationButtons">
            <button class="statusBtn">Check Order Status</button>
            <a href="Home.html">
                <button class="homeBtn">Go back home</button>
            </a>
         </section>


    </main>

    <!-- FOOTER -->
      <footer>
        <nav class="footerNav">
            <a href="AboutUs.html">About Us</a>
            <a href="ContactUs.html">Contact Us</a>
            <a href="Policies.html">Policies</a>
            <a href="FAQ.html">FAQs</a>
        </nav>
      </footer>

    </body>
</html>
