<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js"></script>
</head>
<body>
    <header class="checkoutHeader">
        <a href="Cart.html" class="goBack">
            <button class="backbutton">←</button>
            <h2>Return to shopping cart</h2>
        </a>
    </header>

    <details class="orderSummaryCheckOut">
        <summary>
            Order Summary (n items) - $0
        </summary>

        <section class="itemSummaries">
            <div class="checkoutItem">
                <p>itemName</p>
                <p>$0</p>
            </div>

            <div class="subtotal">
                <p>Subtotal</p>
                <p>$0</p>
            </div>
        </section>
    </details>

    <section class="paymentDetails">
        <form class="paymentForm">

            <!--Personal Info-->
            <section class="personalInfo">
                <h3>Personal Information</h3>

                <input class="checkoutInput" type="text" name="name" placeholder="Your Name" required>

                <div class="detailRow">
                    <input class="checkoutInput" type="email" name="email" placeholder="Email" required>
                    <input class="checkoutInput" type="tel" name="phone" placeholder="Phone Number" required>
                </div>
            </section>

            <!--Shipping Info-->
            <section class="shippingInfo">
                <h3>Shipping Information</h3>

                <div class="detailRow">
                    <input class="checkoutInput" type="text" name="address" placeholder="Address" required>
                    <input class="checkoutInput" type="text" name="postcode" placeholder="Postcode" required>
                    
                </div>

                <div class="detailRow">
                    <input class="checkoutInput" type="text" name="city" placeholder="City" required>
                    <input class="checkoutInput" type="text" name="country" placeholder="Country" required>
                </div>
            </section>

            <!--Shipping Method -->
            <section class="shippingMethod">
                <h3>Shipping Method</h3>
                <label class="shippingOption">
                    <input id="standardShipping"
                        name="shippingMethod" type="radio"
                        checked required>
                    <span for="standardShipping">Standard Shipping</span>
                    <span class="standardPrice">$10</span>

                </label>

                <label class="shippingOption">
                    <input id="expressShipping"
                        name="shippingMethod" type="radio"
                        checked required>
                    <span for="expressShipping">Express Shipping</span>
                    <span class="expressPrice">$15</span>

                </label>

            </section>

            <!-- Payment Methods-->
            <section class="paymentMethod">
                <h3>Payment Methods</h3>

                <div class="payments">
                    <button type="button" class="tab">Credit/Debit Card</button>
                    <button type="button" class="tab">Klarna</button>
                    <button type="button" class="tab">Paypal</button>
                    <button type="button" class="tab"> Apple Pay</button>
                </div>

                <!-- Card Fields-->
                 <article class="cardDetails" id="card">
                    <input class="checkoutInput" type="text" placeholder="Cardholder Name">
                    <div class="detailRow">
                        <input class="checkoutInput" type="text" placeholder="Card Number">
                        <input class="checkoutInput" type="date" placeholder="Expiry Date">
                        <input class="checkoutInput" type="text" placeholder="CVC">
                    </div>
                 </article>
                 
                 <!--Klarna-->
                 <article class="klarnaMethod" id="klarna">
                    <p>Continue with Klarna at next step</p>
                 </article>

                 <!--Paypal-->
                 <article class="paypalMethod" id="paypal">
                    <p>Pay with Paypal</p>
                 </article>

                 <!-- Apply Pay-->
                  <article class="appleMethod" id="applePay">
                    <p>Pay using Apply Pay</p>
                  </article>
            </section>

            <!--Place Order Final Step-->
            <button type="submit" class="placeOrderbtn">
                PLACE ORDER
            </button>


        </form>
        

    </section>


    
    
</body>
</html>
