<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Check Out</h1>
    </header>

    <details class="orderSummary">
        <summary>
            Order Summary (n items) - $0
        </summary>

        <section class="itemSummaries">
            <div class="checkoutItem">
                <p>itemName</p>
                <p>$0</p>
            </div>

            <div class="subtotal">
                <p>Subtotal</p>
                <p>$0</p>
            </div>
        </section>
    </details>

    <section class="paymentDetails">
        <form class="paymentForm">

            <!--Personal Info-->
            <section class="detailSection">
                <h3>Personal Information</h3>

                <input type="text" name="name" placeholder="Your Name" required>
            </section>
        </form>
        

    </section>


    
    
</body>
</html>
