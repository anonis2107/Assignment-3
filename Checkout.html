<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="checkoutHeader">
        <section class="goBack">
            <button class="backbutton" id="checkoutBack" onclick="history.back()">← <span class="gobackLabel">Go Back</span></button>
        </section>

        
        
    </header>
    <h1>Check Out</h1>
    

    <details class="orderSummaryCheckOut">
        <summary id="orderSummary"></summary>

        <section id="itemSummaries"></section>
        <div class="subtotalRow">
            <p>Subtotal</p>
            <p id="subtotalPrice">$0</p>
        </div>
    </details>

    <section class="paymentDetails">
        <form class="paymentForm">

            <!--Personal Info-->
            <section class="personalInfo">
                <h3>Personal Information</h3>

                <input class="checkoutInput" type="text" name="name" id="userName" placeholder="Your Name" maxlength="60" required title="Max 60 characters">

                <div class="detailRow">
                    <input class="checkoutInput" type="email" name="email" placeholder="Email" required>
                    <input class="checkoutInput" type="tel" name="phone" placeholder="Phone Number" maxlength="60" required>
                </div>
            </section>

            <!--Shipping Info-->
            <section class="shippingInfo">
                <h3>Shipping Information</h3>

                <div class="detailRow">
                    <input class="shippingInput" type="text" name="address" placeholder="Address" maxlength="35" required>
                    <input class="shippingInput" type="text" name="postcode" placeholder="Postcode" maxlength="4" required>
                    
                </div>

                <div class="detailRow">
                    <input class="shippingInput" type="text" name="city" placeholder="City" maxlength="35" required>
                    <input class="shippingInput" type="text" name="country" placeholder="Country" maxlength="35" required>
                </div>
            </section>

            <!--Shipping Method -->
            <section class="shippingMethod">
                <h3>Shipping Method</h3>

                <input type="radio" name="shipping" class="shippingOption" id="standard" value="10" checked>
                <label for="standard" class="shippingType">
                    <span>Standard Shipping (3-5 days)</span>
                    <span>$10</span>
                </label>

                <input type="radio" name="shipping" class="shippingOption" id="express" value="15">
                <label for="express" class="shippingType">
                    <span>Express Shipping (1-2 days)</span>
                    <span>$15</span>
                </label>


            </section>

            <!-- Payment Methods-->
            <section class="paymentMethod">
                <h3>Payment Methods</h3>

                <div class="payments">

                    <input type="radio" name="pay" class="radio" id="card" checked>
                    <label for="card"><span>Credit Card</span></label>

                    <input type="radio" name="pay" class="radio" id="klarna">
                    <label for="klarna"><span>Klarna</span></label>


                    <input type="radio" name="pay" class="radio" id="paypal">
                    <label for="paypal"><span>Paypal</span></label>

                    <input type="radio" name="pay" class="radio" id="applePay">
                    <label for="applePay"><span> Apple Pay</span></label>


                    <!-- Card Fields-->
                    <article class="paymentContent cardContent">
                        <input class="checkoutInput" type="text" id="cardName" placeholder="Cardholder Name" maxlength="40" required>

                        <div class="detailRow">

                            <input class="checkoutInput" type="text" placeholder="Card Number" maxlength="16" required>
                            <input class="checkoutInput" type="date" placeholder="Expiry Date" required>
                            <input class="checkoutInput" type="text" placeholder="CVC" maxlength="3" required>
                        </div>
                    </article>
                 
                    <!--Klarna-->
                    <article class="paymentContent klarnaMethod">
                        <p>Continue with Klarna</p>
                    </article>

                    <!--Paypal-->
                    <article class="paymentContent paypalMethod">
                        <p>Pay with Paypal</p>
                    </article>

                    <!-- Apply Pay-->
                    <article class="paymentContent appleMethod">
                        <p>Pay using Apply Pay</p>
                    </article>
                </div>
            </section>

            <section class="finalTotal">
                <p class="checkoutTotal">
                    <span class="totalLabel">Order Total</span>
                    <span id="finalAmount">$0</span>
                </p>

            </section>

            <!--Place Order Final Step-->
            <button type="submit" class="placeOrderBtn"  disabled>
                PLACE ORDER
            </button>

        </form>
        

    </section>


    <script src="scripts.js"></script>
    
</body>
</html>
