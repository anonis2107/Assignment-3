<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <!-- Cart heading-->
    <header class="cartHeader">
        <section class="goBack">
            <button class="backbutton" onclick="history.back()">←</button>
        </section>
        <h1 id="cartTitle">Cart</h1>

    </header>

    <!--Has no items in cart-->
    

    <!--Has items in cart-->
    <section class="cartContent">
            <section class="items"></section>
                
        <section class="notes">
            <h3>Notes</h3>
            <textarea></textarea>
        </section>
        <section class="orderSummary">
            <h3>Order Summary</h3>
            <section class="addUpCosts">
                <h4>Subtotal</h4>
                <span class="cost" id="subtotalCost">$</span>
                <h4>Delivery</h4>
                <span class="cost" id="deliveryCost">$</span>
            </section>
            <section class="total">
                <h3 class="totalTitle">Total</h3>
                <span class="cost" id="totalPrice">$</span>
        </section>

        </section>
        

    </section>
    <div class="checkout">
        <a href="Checkout.html">
            <button class="buttonDisabled" id="checkoutBtn" disabled>CHECKOUT</button>
        </a>
    </div>
    
    
    <script src="scripts.js"></script>
</body>
</html>
